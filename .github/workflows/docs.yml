name: Documentation
on:
  # v0.7.0 does not deploy its site: the site that goes online next ships
  # with v0.8. No release-branch or tag trigger on this line.
  push:
    branches: [main, dev/v0.3-campaign]
  pull_request:
    branches: [main, dev/platform, dev/v0.3-campaign]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instantiate docs environment
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Build docs and check links
        run: julia --project=docs docs/make.jl
        env:
          DOCUMENTER_LINKCHECK: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
